[build]
  command = "npm run build"
  publish = "dist"

  [build.environment]
    NODE_VERSION = "24"

# Single-page app: let the router handle every path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Always revalidate the service worker so updates are picked up promptly.
[[headers]]
  for = "/serviceWorker.js"
  [headers.values]
    Cache-Control = "no-cache"
